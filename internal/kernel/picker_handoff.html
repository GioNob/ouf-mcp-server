<!doctype html>
<html lang="it">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Caricamento CSV OUF</title>
<body>
<p id="status" role="status">Preparazione del selettore OUF…</p>
<button id="open" type="button" hidden>Scegli file in OUF</button>
<script>
(async () => {
  const host = window.openai;
  const status = document.getElementById('status');
  const button = document.getElementById('open');
  // The host may populate toolOutput after the iframe starts executing.
  let output = host?.toolOutput;
  if (!output?.handoffId || !output?.pickerUrl) {
    output = await new Promise(resolve => {
      const timeout = setTimeout(() => { window.removeEventListener('openai:set_globals', changed); resolve(host?.toolOutput); }, 10000);
      function changed() {
        const next = host?.toolOutput;
        if (next?.handoffId && next?.pickerUrl) {
          clearTimeout(timeout);
          window.removeEventListener('openai:set_globals', changed);
          resolve(next);
        }
      }
      window.addEventListener('openai:set_globals', changed);
      changed();
    });
  }
  const id = output?.handoffId;
  const url = output?.pickerUrl;
  if (!/^[0-9a-f-]{36}$/.test(id ?? '') ||
      url !== 'https://api.ouf-lab.it/trusted-human/managed-files/?handoff=' + id) {
    status.textContent = 'Collegamento al picker non disponibile. Avvia un nuovo caricamento dalla chat.';
    return;
  }
  button.hidden = false;
  button.onclick = () => host?.openExternal ? host.openExternal({href: url, redirectUrl: false}) : window.open(url, '_blank', 'noopener');
  if (host?.widgetState?.reportedHandoffId === id) {
    status.textContent = 'CSV registrato e comunicato alla chat.';
    return;
  }
  if (typeof host?.callTool !== 'function') {
  status.textContent = 'Apri OUF; dopo il caricamento l’Asset ID resta visibile nella pagina.';
    return;
  }
  status.textContent = 'Scegli il CSV in OUF. Questo riquadro attende l’esito e lo invia alla chat.';
  for (let n = 0; n < 90; n++) {
    await new Promise(resolve => setTimeout(resolve, 10000));
    try {
      const reply = await host.callTool('source.file.upload.status', {handoffId: id});
      const raw = reply?.structuredContent ?? JSON.parse(reply?.content?.[0]?.text ?? '{}');
      if (reply?.isError || raw?.code) {
        status.textContent = 'Impossibile leggere l’esito in chat. L’Asset ID resta visibile nella pagina OUF.';
        return;
      }
      if (raw?.status !== 'STAGED' || !/^[0-9a-f-]{36}$/.test(raw.assetId ?? '')) continue;
      status.textContent = 'CSV registrato in OUF. Invio l’esito alla chat…';
      if (typeof host.sendFollowUpMessage === 'function') {
        await host.sendFollowUpMessage({prompt: 'Il CSV è stato registrato in OUF con Asset ID ' + raw.assetId + '. Avvia il profilo usando source.file.profile con questo ID.'});
        host.setWidgetState?.({reportedHandoffId: id});
        status.textContent = 'CSV registrato e comunicato alla chat.';
      } else status.textContent = 'CSV registrato. Asset ID: ' + raw.assetId;
      return;
    } catch (_) { /* A transient poll must not imply that the upload failed. */ }
  }
  status.textContent = 'L’attesa è terminata. Se il file è stato caricato, l’Asset ID resta visibile in OUF.';
})();
</script>
</body>
</html>

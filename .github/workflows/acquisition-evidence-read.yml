name: Bounded acquisition read MCP binding
on:
  push:
    branches: [feat/acquisition-evidence-read-20261025]
  pull_request:
    paths: ['internal/kernel/**', 'internal/manifest/**', 'internal/adapter/httpclient/**', '.github/workflows/acquisition-evidence-read.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  sdk-policy-and-transport:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with: {go-version: '1.27.3', cache: true}
      - name: Verify formatting
        run: test -z "$(gofmt -l internal/kernel internal/manifest internal/adapter/httpclient)"
      - name: Real MCP SDK, current owner policy and TLS adapter; synthetic owner results
        run: go test -race ./internal/manifest ./internal/kernel ./internal/adapter/httpclient -v -count=1

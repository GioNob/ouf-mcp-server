name: Permission read real SDK regression
on:
  push:
    branches: [test/permission-read-sdk-20261018]
permissions: {contents: read}
jobs:
  sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-go@v6
        with: {go-version: '1.26.9', cache: true}
      - run: gofmt -w internal/kernel/permission_read_transport_test.go
      - run: go test ./internal/kernel -run TestPermissionReadSelectorsRoundTripThroughRealMCPTransport -count=1 -v

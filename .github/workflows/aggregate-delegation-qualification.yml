name: Operational aggregate delegated context qualification
on: [push, pull_request]
permissions: {contents: read}
jobs:
  owner-vector-metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env: {POSTGRES_USER: mcp, POSTGRES_PASSWORD: mcp, POSTGRES_DB: mcp_test}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mcp -d mcp_test" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      MCP_TEST_DATABASE_URL: postgres://mcp:mcp@localhost:5432/mcp_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with: {go-version: '1.27.3', cache: true}
      - run: go mod download
      - name: Native formatter and exact source evidence
        run: |
          gofmt -w cmd/ouf-mcp/main.go internal/adapter/httpclient/clients.go internal/adapter/httpclient/operational_delegation_test.go internal/operational/owner_api.go internal/operational/aggregate_delegation_test.go internal/operational/cursor_composer.go internal/operational/cursor_composer_test.go internal/operational/aggregator.go internal/operational/cursor_state.go internal/operational/cursor_state_test.go internal/adapter/postgres/operational_cursor.go internal/adapter/postgres/operational_cursor_integration_test.go
          python3 - <<'PY'
          import json,pathlib
          paths=['cmd/ouf-mcp/main.go','internal/adapter/httpclient/clients.go','internal/adapter/httpclient/operational_delegation_test.go','internal/operational/owner_api.go','internal/operational/aggregate_delegation_test.go','internal/operational/cursor_composer.go','internal/operational/cursor_composer_test.go','internal/operational/aggregator.go','internal/operational/cursor_state.go','internal/operational/cursor_state_test.go','internal/adapter/postgres/operational_cursor.go','internal/adapter/postgres/operational_cursor_integration_test.go']
          for path in paths:
              print('OUF_NATIVE_GOFMT='+json.dumps({'path':path,'content':pathlib.Path(path).read_text()},separators=(',',':')))
          PY
      - run: go test -race ./internal/operational -run 'TestAggregateDelegation|TestIncidentCursor' -count=1 -v
      - run: go test -race ./internal/adapter/httpclient -run 'TestOperationalDelegation' -count=1 -v
      - run: go test ./internal/adapter/postgres -run TestIncidentCursor -count=1 -v
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operational-cursor-metadata-${{ github.run_id }}
          path: |
            internal/operational/cursor_state*
            internal/operational/cursor_composer*
            internal/operational/aggregator.go
            internal/adapter/postgres/operational_cursor*
            internal/adapter/postgres/migrations/008_operational_cursor_metadata.sql
          retention-days: 30

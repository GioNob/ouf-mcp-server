name: MCP evidence and late recovery
on: [push, pull_request]
permissions: {contents: read}
jobs:
  protocol-and-lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env: {POSTGRES_USER: mcp, POSTGRES_PASSWORD: mcp, POSTGRES_DB: mcp_test}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mcp -d mcp_test" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      MCP_TEST_DATABASE_URL: postgres://mcp:mcp@localhost:5432/mcp_test?sslmode=disable
      MCP_DATABASE_URL: postgres://mcp:mcp@localhost:5432/mcp_test?sslmode=disable
      MCP_GATEWAY_RECOVERY_ENDPOINT: http://127.0.0.1:1/internal/capabilities/v1/recovery
      MCP_WORKLOAD_TOKEN: ci-synthetic-workload-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: GioNob/ouf-api-gateway
          ref: 46ec62f9658ec9c669d8ea6259fda40cc81c268e
          path: .pairwise/gateway
      - uses: actions/checkout@v4
        with:
          repository: GioNob/ouf-ingestion-runtime
          ref: 527f6f9ebfc967bb186142f69001174734758432
          path: .pairwise/ingestion
      - uses: actions/checkout@v4
        with:
          repository: GioNob/ouf-source-onboarding
          ref: fb2dd51dfc204577a47c1e702f17531dd0709b3c
          path: .pairwise/authorization
      - uses: actions/setup-go@v6
        with: {go-version: '1.27.3', cache: true}
      - name: Verify official Go distribution and retain checksum
        run: |
          mkdir -p build
          python3 - <<'PYGO'
          import hashlib,json,os,pathlib,subprocess,tarfile,tempfile,urllib.request
          version='go1.27.3'
          assert subprocess.check_output(['go','env','GOVERSION'],text=True).strip()==version
          assert subprocess.check_output(['go','env','GOHOSTOS'],text=True).strip()=='linux'
          assert subprocess.check_output(['go','env','GOHOSTARCH'],text=True).strip()=='amd64'
          with urllib.request.urlopen('https://go.dev/dl/?mode=json',timeout=60) as response:
              releases=json.load(response)
          release=next(r for r in releases if r['version']==version and r['stable'] is True)
          row=next(f for f in release['files'] if f['filename']==version+'.linux-amd64.tar.gz')
          assert row['os']=='linux' and row['arch']=='amd64' and row['kind']=='archive'
          with tempfile.TemporaryDirectory(dir=os.environ['RUNNER_TEMP']) as temporary:
              archive=pathlib.Path(temporary)/row['filename'];sha=hashlib.sha256();size=0
              with urllib.request.urlopen('https://dl.google.com/go/'+row['filename'],timeout=180) as response,archive.open('xb') as output:
                  while chunk:=response.read(1048576):
                      size+=len(chunk);assert size<=row['size'];sha.update(chunk);output.write(chunk)
              assert size==row['size'] and sha.hexdigest()==row['sha256']
              with tarfile.open(archive,'r:gz') as distribution:
                  officialGo=hashlib.sha256(distribution.extractfile('go/bin/go').read()).hexdigest()
              goroot=pathlib.Path(subprocess.check_output(['go','env','GOROOT'],text=True).strip())
              assert hashlib.sha256((goroot/'bin/go').read_bytes()).hexdigest()==officialGo
          record={'schema':'ouf.mcp-official-go-distribution.v1','version':version,
              'filename':row['filename'],'archiveSha256':row['sha256'],'archiveBytes':size,
              'officialGoExecutableSha256':officialGo,'officialArchiveChecksumVerified':True,
              'installedGoExecutableMatchesOfficialArchive':True,'sourceCommit':os.environ['GITHUB_SHA'],
              'runtimeAuthorityIssued':False,'targetApplyAuthorized':False}
          pathlib.Path('build/go-official-distribution.json').write_text(json.dumps(record,indent=2)+'\n')
          print(json.dumps(record,sort_keys=True))
          PYGO
      - run: go mod download
      - run: node scripts/test_picker_portability.mjs
      - run: pip install -r .pairwise/gateway/requirements-dev.txt
      - run: GATEWAY_PAIRWISE_ROOT="$PWD/.pairwise/gateway" go test ./internal/adapter/httpclient -run TestMCPGatewayUDPPairwise -v
      - run: GATEWAY_PAIRWISE_ROOT="$PWD/.pairwise/gateway" go test ./internal/evidence -run TestGatewayEvidenceIngressPairwise -v
      - run: GATEWAY_PAIRWISE_ROOT="$PWD/.pairwise/gateway" go test ./internal/deployment -run TestMCPGatewayDeploymentSecurityPairwise -v
      - run: GATEWAY_PAIRWISE_ROOT="$PWD/.pairwise/gateway" go test ./internal/deployment -run TestMCPGatewayOperationalAwarenessPairwise -v
      - run: GATEWAY_PAIRWISE_ROOT="$PWD/.pairwise/gateway" INGESTION_PAIRWISE_ROOT="$PWD/.pairwise/ingestion" go test ./internal/deployment -run TestOperationalExplainOwnerPairwise -v
      - run: GATEWAY_PAIRWISE_ROOT="$PWD/.pairwise/gateway" go test ./internal/deployment -run TestChannelNeutralSystemStatusPairwise -v
      - run: GATEWAY_PAIRWISE_ROOT="$PWD/.pairwise/gateway" go test ./internal/deployment -run TestOperationalAwarenessAggregationPairwise -v
      - run: AUTHORIZATION_PAIRWISE_ROOT="$PWD/.pairwise/authorization" go test ./internal/deployment -run TestAuthorizationMCPPairwise -v
      - run: go test ./internal/deployment -run TestAuthorizationLocalRuntimeContract -v
      - run: go test ./internal/deployment -run TestMCP1IObservabilityCapacityAndDRContracts -v
      - run: bash scripts/verify.sh
      - run: docker build -t ouf-mcp:ci .
      - run: python3 -m py_compile scripts/r4a_snapshot_mcp_runtime.py scripts/r4a_preflight_mcp_runtime.py scripts/r4a_prepare_mcp_candidate.py scripts/r4a_rollout_mcp_runtime.py
      - run: ./build/ouf-mcp migrate
      - run: ./build/ouf-mcp maintenance-worker --once
      - run: go run honnef.co/go/tools/cmd/staticcheck@2026.1 ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - name: Retain qualified MCP image without target activation
        run: |
          mkdir -p build/acquisition-release
          docker image inspect --format '{{.Id}}' ouf-mcp:ci > build/acquisition-release/image-id.txt
          docker image inspect ouf-mcp:ci > build/acquisition-release/image-config.json
          docker save ouf-mcp:ci | gzip -1 > build/acquisition-release/image.tar.gz
          printf '%s\n' "$GITHUB_SHA" > build/acquisition-release/source-commit.txt
          cp internal/manifest/capabilities.json build/acquisition-release/
          cd build/acquisition-release && sha256sum image.tar.gz image-id.txt image-config.json source-commit.txt capabilities.json > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with: {name: 'acquisition-mcp-image-${{ github.run_id }}', path: build/acquisition-release/, retention-days: 30}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-release-evidence-${{ github.run_id }}
          path: |
            build/go-official-distribution.json
            docs/
            deploy/
            observability/
            internal/deployment/
            internal/manifest/capabilities.json
            internal/kernel/
            internal/authorization/
            internal/observability/
            internal/operational/
            internal/adapter/postgres/migrations/
            internal/adapter/postgres/operational_awareness.go
            internal/adapter/postgres/operational_awareness_integration_test.go
            internal/adapter/postgres/concurrency_release_gate_integration_test.go
            internal/adapter/postgres/debt_admission_gate_integration_test.go
            internal/adapter/postgres/performance_profile_integration_test.go
            internal/adapter/httpclient/pairwise_integration_test.go
            internal/adapter/httpclient/policy_bundle.go
            internal/evidence/gateway_pairwise_test.go
          retention-days: 30


name: MCP evidence and late recovery
on: [push, pull_request]
permissions: {contents: read}
jobs:
  protocol-and-lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env: {POSTGRES_USER: mcp, POSTGRES_PASSWORD: mcp, POSTGRES_DB: mcp_test}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mcp -d mcp_test" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      MCP_TEST_DATABASE_URL: postgres://mcp:mcp@localhost:5432/mcp_test?sslmode=disable
      MCP_DATABASE_URL: postgres://mcp:mcp@localhost:5432/mcp_test?sslmode=disable
      MCP_GATEWAY_RECOVERY_ENDPOINT: http://127.0.0.1:1/internal/capabilities/v1/recovery
      MCP_WORKLOAD_TOKEN: ci-synthetic-workload-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: GioNob/ouf-api-gateway
          ref: 0ab1a9290b03c51ac71e0e90ae70582241ab48d5
          path: .pairwise/gateway
      - uses: actions/checkout@v4
        with:
          repository: GioNob/ouf-ingestion-runtime
          ref: 58d9caf609b2d1f3b8ce49d6fac0abff73f740db
          path: .pairwise/ingestion
      - uses: actions/setup-go@v6
        with: {go-version: '1.25.13', cache: true}
      - run: go mod download
      - run: pip install -r .pairwise/gateway/requirements-dev.txt
      - run: GATEWAY_PAIRWISE_ROOT="$PWD/.pairwise/gateway" go test ./internal/adapter/httpclient -run TestMCPGatewayUDPPairwise -v
      - run: GATEWAY_PAIRWISE_ROOT="$PWD/.pairwise/gateway" go test ./internal/evidence -run TestGatewayEvidenceIngressPairwise -v
      - run: GATEWAY_PAIRWISE_ROOT="$PWD/.pairwise/gateway" go test ./internal/deployment -run TestMCPGatewayDeploymentSecurityPairwise -v
      - run: GATEWAY_PAIRWISE_ROOT="$PWD/.pairwise/gateway" go test ./internal/deployment -run TestMCPGatewayOperationalAwarenessPairwise -v
      - run: GATEWAY_PAIRWISE_ROOT="$PWD/.pairwise/gateway" INGESTION_PAIRWISE_ROOT="$PWD/.pairwise/ingestion" go test ./internal/deployment -run TestOperationalExplainOwnerPairwise -v
      - run: GATEWAY_PAIRWISE_ROOT="$PWD/.pairwise/gateway" go test ./internal/deployment -run TestChannelNeutralSystemStatusPairwise -v
      - run: GATEWAY_PAIRWISE_ROOT="$PWD/.pairwise/gateway" go test ./internal/deployment -run TestOperationalAwarenessAggregationPairwise -v
      - run: bash scripts/verify.sh
      - run: ./build/ouf-mcp migrate
      - run: ./build/ouf-mcp maintenance-worker --once
      - run: go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-operational-awareness-evidence-${{ github.run_id }}
          path: |
            docs/
            deploy/
            internal/deployment/
            internal/manifest/capabilities.json
            internal/kernel/
            internal/operational/
            internal/adapter/postgres/migrations/
            internal/adapter/postgres/operational_awareness.go
            internal/adapter/postgres/operational_awareness_integration_test.go
            internal/adapter/postgres/concurrency_release_gate_integration_test.go
            internal/adapter/postgres/debt_admission_gate_integration_test.go
            internal/adapter/httpclient/pairwise_integration_test.go
            internal/evidence/gateway_pairwise_test.go
          retention-days: 30

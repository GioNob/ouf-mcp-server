name: Authorization Java Go conformance
on: [push, pull_request, workflow_dispatch]
permissions: {contents: read}
jobs:
  common-vectors:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: GioNob/ouf-source-onboarding
          ref: 8ac76d345df3b13b7b858ef1ba45ea22856e9d31
          path: .pairwise/authorization
      - name: Verify common fixture provenance
        run: cmp .pairwise/authorization/authorization-sdk/src/test/resources/authorization-conformance-v1.json internal/authorization/testdata/authorization-conformance-v1.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Execute common decision vectors
        run: go test -count=1 -v ./internal/authorization -run TestCommonJavaGoConformance

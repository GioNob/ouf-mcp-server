name: Ingestion source read binding qualification
on:
  push:
    branches: [csv-ingestion-source-read-20261012]
    paths:
      - internal/kernel/**
      - internal/orchestration/service.go
      - .github/workflows/ingestion-source-read.yml
  workflow_dispatch:
permissions: {contents: read}
jobs:
  sdk-source-authorization:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-go@v6
        with: {go-version: '1.27.3', cache: true}
      - name: Verify committed formatting
        run: test -z "$(gofmt -l internal/kernel internal/orchestration)"
      - run: go test -race ./internal/kernel -run 'TestIngestion' -v -count=1

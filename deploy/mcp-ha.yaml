apiVersion: apps/v1
kind: Deployment
metadata: {name: mcp-server, namespace: ouf-mcp}
spec:
  replicas: 2
  selector: {matchLabels: {ouf.component: mcp-server}}
  template:
    metadata:
      labels: {ouf.component: mcp-server}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8080"
    spec:
      serviceAccountName: ouf-mcp-server
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector: {matchLabels: {ouf.component: mcp-server}}
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: mcp
          image: ghcr.io/gionob/ouf-mcp-server:latest
          ports: [{name: http, containerPort: 8080}]
          env:
            - {name: MCP_DATABASE_URL, valueFrom: {secretKeyRef: {name: mcp-db, key: url}}}
            - {name: MCP_GATEWAY_ENDPOINT, valueFrom: {configMapKeyRef: {name: mcp-runtime, key: gatewayEndpoint}}}
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 5
            timeoutSeconds: 1
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 10
            timeoutSeconds: 1
          resources:
            requests: {cpu: "500m", memory: "768Mi"}
            limits: {cpu: "2", memory: "1536Mi"}
---
apiVersion: v1
kind: Service
metadata: {name: mcp-server, namespace: ouf-mcp}
spec:
  selector: {ouf.component: mcp-server}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: mcp-server, namespace: ouf-mcp}
spec:
  minAvailable: 1
  selector: {matchLabels: {ouf.component: mcp-server}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: mcp-maintenance-worker, namespace: ouf-mcp}
spec:
  replicas: 1
  selector: {matchLabels: {ouf.component: mcp-maintenance-worker}}
  template:
    metadata: {labels: {ouf.component: mcp-maintenance-worker}}
    spec:
      serviceAccountName: ouf-mcp-maintenance
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: worker
          image: ghcr.io/gionob/ouf-mcp-server:latest
          args: ["maintenance-worker"]
          env:
            - {name: MCP_DATABASE_URL, valueFrom: {secretKeyRef: {name: mcp-maintenance-db, key: url}}}
          resources:
            requests: {cpu: "100m", memory: "128Mi"}
            limits: {cpu: "500m", memory: "512Mi"}
